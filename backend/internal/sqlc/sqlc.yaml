version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "../db/migrations/"
    gen:
      go:
        package: "sqlcgen"
        out: "generated/"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "alert_severity"
            go_type:
              type: "string"
          - db_type: "alert_status"
            go_type:
              type: "string"
          - db_type: "user_role"
            go_type:
              type: "string"
